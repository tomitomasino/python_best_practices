name: Deploy Application

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'business_params/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  validate-business-params:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate business parameters
        run: |
          TARGET_ENV=${{ github.event.inputs.environment || 'development' }}
          if [ ! -f "business_params/${TARGET_ENV}.yaml" ]; then
            echo "Error: Missing business parameters for ${TARGET_ENV}"
            exit 1
          fi
          echo "✓ Found business parameters for ${TARGET_ENV}"

  build-and-deploy:
    needs: validate-business-params
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    
    env:
      CONTAINER_APP_NAME: ikea-api-${{ github.event.inputs.environment || 'development' }}
      CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      IMAGE_NAME: ikea-api
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            ENVIRONMENT=${{ github.event.inputs.environment || 'development' }}
          
      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageName: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 8000
          ingress: external
          environmentVariables: |
            APP_NAME=${{ vars.APP_NAME }}
            APP_VERSION=${{ github.sha }}
            ENVIRONMENT=${{ github.event.inputs.environment || 'development' }}
            DATABASE_POOL_SIZE=${{ vars.DATABASE_POOL_SIZE }}
            MAINTENANCE_MODE=${{ vars.MAINTENANCE_MODE }}
            DEPLOYMENT_ENABLED=${{ vars.DEPLOYMENT_ENABLED }}
          secrets: |
            [
              {
                "name": "DATABASE-URL",
                "keyVaultReference": {
                  "vaultName": "${{ secrets.KEY_VAULT_NAME }}",
                  "secretName": "database-url-${{ github.event.inputs.environment || 'development' }}"
                }
              }
            ]

      - name: Verify deployment
        run: |
          echo "Verifying deployment health..."
          HEALTH_CHECK_URL="https://${{ env.CONTAINER_APP_NAME }}.azurecontainerapps.io/health"
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_CHECK_URL)
            if [ $response -eq 200 ]; then
              echo "✓ Application deployed successfully"
              exit 0
            fi
            sleep 10
          done
          echo "× Deployment verification failed"
          exit 1